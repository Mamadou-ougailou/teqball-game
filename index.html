<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/teqball-icon.svg" />
<title>TEQBALL — Surrealistic</title>
<link rel="stylesheet" href="/src/landing.css" />
</head>
<body>

<div id="cursor"></div>
<div id="cursor-ring"></div>

<div id="transition">
  <div id="transition-text">LOADING</div>
</div>

<!-- ── LANDING PAGE ── -->
<div id="app">

  <!-- VIDEO PANEL -->
  <div id="video-panel">
    <div class="video-slots">

      <div class="video-slot" id="slot-arena">
        <canvas id="canvas-arena"></canvas>
        <div class="slot-label">Arènes surréalistes</div>
        <div class="slot-tag">Preview</div>
      </div>

      <div class="video-slot" id="slot-char">
        <canvas id="canvas-char"></canvas>
        <div class="slot-label">Personnages & Superpouvoirsm</div>
        <div class="slot-tag">Preview</div>
      </div>

    </div>
  </div>

  <!-- MENU PANEL -->
  <div id="menu-panel">

    <div class="logo-block">
      <div class="logo-eyebrow">Babylonjs · Web Game</div>
      <div class="logo-title">
        Teqball
        <span>Surrealistic Edition</span>
      </div>
    </div>

    <nav>
      <ul class="nav-list">
        <li class="nav-item">
          <button class="nav-btn primary" data-action="play" id="btn-play">
            <span class="nav-num">01</span>
            Jouer
            <span class="nav-arrow">→</span>
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-btn" data-action="characters">
            <span class="nav-num">02</span>
            Personnages
            <span class="nav-arrow">→</span>
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-btn" data-action="arenas">
            <span class="nav-num">03</span>
            Arènes
            <span class="nav-arrow">→</span>
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-btn" data-action="settings">
            <span class="nav-num">04</span>
            Paramètres
            <span class="nav-arrow">→</span>
          </button>
        </li>
      </ul>
    </nav>

    <div class="bottom-bar">
      <div class="version-tag">v1.0.0 — MVP Build</div>
      <div class="controls-hint">
        <kbd>W A S D</kbd> / <kbd>↑ ← ↓ →</kbd> Mouvement<br>
        <kbd>F</kbd> / <kbd>L</kbd> Tir &nbsp;&nbsp; <kbd>G</kbd> / <kbd>;</kbd> Superpower
      </div>
    </div>

  </div>

</div>

<!-- ── GAME SCREEN (hidden until Play) ── -->
<div id="game-screen">
  <canvas id="renderCanvas"></canvas>
  <div id="loading-screen">
    <div class="loading-spinner"></div>
    <p>Initializing Surrealistic Teqball...</p>
  </div>
  <button class="back-btn" id="back-btn">← Menu</button>
</div>

<script src="/src/landing.js"></script>
</body>
</html>
