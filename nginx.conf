server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── Required for Havok physics ────────────────────────────────────────────
    # Havok uses SharedArrayBuffer which browsers only allow under cross-origin
    # isolation.  Both headers must be present on every response.
    add_header Cross-Origin-Opener-Policy  "same-origin"   always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # ── WASM MIME type ────────────────────────────────────────────────────────
    # nginx's default mime.types already includes application/wasm since 1.21,
    # but we make it explicit here to be safe.
    types {
        application/wasm           wasm;
        text/html                  html htm;
        text/css                   css;
        application/javascript     js mjs;
        application/json           json;
        image/png                  png;
        image/jpeg                 jpg jpeg;
        image/svg+xml              svg;
        font/woff2                 woff2;
    }

    # ── SPA routing ───────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Cache static assets aggressively ─────────────────────────────────────
    location ~* \.(js|mjs|css|wasm|glb|png|jpg|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Headers must be repeated here because add_header in a nested location
        # overrides the parent-level add_header directives.
        add_header Cross-Origin-Opener-Policy  "same-origin"   always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }
}
